name: CI

on:
  push:
    branches: [main, experimental-jit]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install orjson || true

      - name: Build extension
        run: python setup.py build_ext --inplace

      - name: Run serializer tests
        env:
          PYTHONPATH: src
        run: python tests/test_serializer.py

      - name: Run memory leak & refcount tests
        env:
          PYTHONPATH: src
        run: python tests/test_memory_leaks.py

      - name: Run v0.1.1 regression tests
        env:
          PYTHONPATH: src
        run: python tests/test_regressions_v011.py

      - name: Run JIT security, fuzz, and concurrency tests
        env:
          PYTHONPATH: src
        run: python tests/test_jit_security.py

      - name: Run conformance, fork, and fuzz tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -c "import orjson" 2>/dev/null && python tests/test_conformance_fuzz.py || echo "Skipping orjson differential tests (orjson not available for this Python version)"

  sanitizers:
    name: ASan + UBSan (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install orjson numpy

      - name: Build with AddressSanitizer & UBSan
        shell: bash
        run: |
          CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
          LDFLAGS="-fsanitize=address,undefined" \
          python setup.py build_ext --inplace --force

      - name: Run serializer, fuzz, memory, and NumPy tests under ASan + UBSan
        shell: bash
        env:
          PYTHONPATH: src
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          LD_PRELOAD="$ASAN_LIB" python tests/test_serializer.py
          LD_PRELOAD="$ASAN_LIB" python tests/test_conformance_fuzz.py
          LD_PRELOAD="$ASAN_LIB" python tests/test_numpy.py
          LD_PRELOAD="$ASAN_LIB" python tests/test_regressions_v011.py
          LD_PRELOAD="$ASAN_LIB" python tests/test_jit_security.py

  benchmark-gate:
    name: Perf Gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
          - os: macos-latest
            label: macOS ARM64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Download benchmark datasets
        shell: bash
        run: |
          mkdir -p /tmp/cxjson_bench_data
          curl -sSL -o /tmp/cxjson_bench_data/twitter.json https://raw.githubusercontent.com/simdjson/simdjson-data/master/jsonexamples/twitter.json
          curl -sSL -o /tmp/cxjson_bench_data/citm_catalog.json https://raw.githubusercontent.com/simdjson/simdjson-data/master/jsonexamples/citm_catalog.json
          curl -sSL -o /tmp/cxjson_bench_data/canada.json https://raw.githubusercontent.com/simdjson/simdjson-data/master/jsonexamples/canada.json
          curl -sSL -o /tmp/cxjson_bench_data/gsoc-2018.json https://raw.githubusercontent.com/simdjson/simdjson-data/master/jsonexamples/gsoc-2018.json
          curl -sSL -o /tmp/cxjson_bench_data/usgs_earthquakes_week.json https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson
          curl -sSL -o /tmp/cxjson_bench_data/pypi_numpy.json https://pypi.org/pypi/numpy/json

      - name: Build HEAD (PR / current commit)
        shell: bash
        run: |
          python setup.py build_ext --inplace --force
          mkdir -p /tmp/cxjson_head
          cp -r src/cxjson /tmp/cxjson_head/

      - name: Build base branch (PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git checkout "${{ github.base_ref }}" || git checkout "origin/${{ github.base_ref }}"
          python setup.py build_ext --inplace --force
          mkdir -p /tmp/cxjson_base
          cp -r src/cxjson /tmp/cxjson_base/

      - name: Run self-comparison benchmark (PR vs base, max 10% regression)
        shell: bash
        env:
          ARCH_LABEL: ${{ matrix.label }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'EOF'
          import json, math, os, subprocess, sys

          FILES = [
              "twitter.json",
              "citm_catalog.json",
              "canada.json",
              "gsoc-2018.json",
              "usgs_earthquakes_week.json",
              "pypi_numpy.json",
          ]
          DATA_DIR = "/tmp/cxjson_bench_data"
          label = os.environ["ARCH_LABEL"]
          is_pr = os.environ["IS_PR"].lower() == "true"

          WORKER = r"""
          import gc, json, os, statistics, sys, time, cxjson
          files = sys.argv[1:]
          out = {}
          for name in files:
              raw = open(os.path.join('/tmp/cxjson_bench_data', name), 'rb').read()
              obj = cxjson.loads(raw)
              out_len = len(cxjson.dumps(obj))
              gc.collect()
              cxjson.dumps(obj); cxjson.loads(raw)
              td, tl = [], []
              for _ in range(15):
                  t0 = time.perf_counter(); cxjson.dumps(obj); td.append(time.perf_counter() - t0)
                  t0 = time.perf_counter(); cxjson.loads(raw); tl.append(time.perf_counter() - t0)
              out[name] = [
                  (out_len / 1048576.0) / statistics.median(td),
                  (len(raw) / 1048576.0) / statistics.median(tl),
              ]
          print(json.dumps(out))
          """

          def run_one(pypath):
              env = os.environ.copy()
              env["PYTHONPATH"] = pypath
              res = subprocess.check_output([sys.executable, "-c", WORKER, *FILES], env=env, text=True)
              return json.loads(res)

          if is_pr:
              # Run 2 alternating rounds on the same VM and take median per dataset
              h1, b1 = run_one("/tmp/cxjson_head"), run_one("/tmp/cxjson_base")
              b2, h2 = run_one("/tmp/cxjson_base"), run_one("/tmp/cxjson_head")
              d_ratios, l_ratios = [], []
              lines = [
                  f"### Perf Gate (PR vs base) — {label}",
                  "| Dataset | base dumps | PR dumps | Ratio | base loads | PR loads | Ratio |",
                  "|---|---:|---:|---:|---:|---:|---:|",
              ]
              for name in FILES:
                  hd = max(h1[name][0], h2[name][0])
                  bd = max(b1[name][0], b2[name][0])
                  hl = max(h1[name][1], h2[name][1])
                  bl = max(b1[name][1], b2[name][1])
                  dr, lr = hd / bd, hl / bl
                  d_ratios.append(dr); l_ratios.append(lr)
                  lines.append(f"| `{name}` | {bd:.0f} MB/s | {hd:.0f} MB/s | **{dr:.2f}x** | {bl:.0f} MB/s | {hl:.0f} MB/s | **{lr:.2f}x** |")

              gm_d = math.exp(sum(math.log(x) for x in d_ratios) / len(d_ratios))
              gm_l = math.exp(sum(math.log(x) for x in l_ratios) / len(l_ratios))
              lines.append(f"| **Geo-Mean** | — | — | **{gm_d:.2f}x** (min 0.90x) | — | — | **{gm_l:.2f}x** (min 0.90x) |")
              report = "\n".join(lines)
              print(report)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as sf:
                      sf.write(report + "\n\n")
              if gm_d < 0.90 or gm_l < 0.90:
                  print(f"::error::Performance regression >10% on {label}: dumps={gm_d:.2f}x, loads={gm_l:.2f}x vs base")
                  sys.exit(1)
              print(f"PASS: No regression on {label} (dumps={gm_d:.2f}x, loads={gm_l:.2f}x vs base)")
          else:
              h = run_one("/tmp/cxjson_head")
              lines = [
                  f"### Benchmark Snapshot (main) — {label}",
                  "| Dataset | `cxjson` dumps | `cxjson` loads |",
                  "|---|---:|---:|",
              ]
              ds_vals, ls_vals = [], []
              for name in FILES:
                  hd, hl = h[name]
                  ds_vals.append(hd); ls_vals.append(hl)
                  lines.append(f"| `{name}` | {hd:.0f} MB/s | {hl:.0f} MB/s |")
              gm_d = math.exp(sum(math.log(x) for x in ds_vals) / len(ds_vals))
              gm_l = math.exp(sum(math.log(x) for x in ls_vals) / len(ls_vals))
              lines.append(f"| **Geo-Mean** | **{gm_d:.0f} MB/s** | **{gm_l:.0f} MB/s** |")
              report = "\n".join(lines)
              print(report)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as sf:
                      sf.write(report + "\n\n")
          EOF
