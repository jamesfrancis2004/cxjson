name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install orjson || true

      - name: Build extension
        run: python setup.py build_ext --inplace

      - name: Run serializer tests
        env:
          PYTHONPATH: src
        run: python tests/test_serializer.py

      - name: Run conformance, fork, and fuzz tests
        env:
          PYTHONPATH: src
        run: |
          python -c "import orjson" 2>/dev/null && python tests/test_conformance_fuzz.py || echo "Skipping orjson differential tests (orjson not available for this Python version)"
